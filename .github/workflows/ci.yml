name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: avt
          POSTGRES_PASSWORD: avt
          POSTGRES_DB: avt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avt" --health-interval 2s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      AVT_TEST_DATABASE_URL: postgresql+asyncpg://avt:avt@localhost:5432/avt_test
      AVT_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests alembic
      - run: uv run ruff format --check src tests alembic
      - run: uv run mypy
      - name: Migrations match the models
        env:
          AVT_DATABASE_URL: postgresql+asyncpg://avt:avt@localhost:5432/avt_test
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests (unit + integration against Postgres and Redis)
        run: uv run pytest --cov=avt --cov-report=term-missing:skip-covered
      - name: OpenAPI spec is up to date
        run: |
          uv run python -m avt.cli.openapi /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the spec
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: avt
          POSTGRES_PASSWORD: avt
          POSTGRES_DB: avt_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avt" --health-interval 2s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://avt:avt@localhost:5432/avt_e2e
      E2E_REDIS_URL: redis://localhost:6379/14
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
